# Runs on Depot CI (not GitHub Actions). Tests on every push and pull request; pushes to main and v* tags
# also build the multi-arch image with ko to ghcr.io and sign it with the repo's cosign key (verify with
# cosign.pub; keyless signing does not work here, Fulcio rejects Depot's OIDC tokens).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: depot-ubuntu-24.04
    env:
      KO_DOCKER_REPO: ghcr.io/cullenmcdermott/nats-auth-callout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and push
        id: build
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
        run: |
          ko() { go run github.com/google/ko@v0.19.1 "$@"; }
          echo "$GHCR_TOKEN" | ko login ghcr.io -u "$ACTOR" --password-stdin
          ref=$(ko build --bare --platform=linux/amd64,linux/arm64 --tags "sha-${GITHUB_SHA::7},${REF//\//-}" .)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image digest
        env:
          REF: ${{ steps.build.outputs.ref }}
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_KEY "$REF"
